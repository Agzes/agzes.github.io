        <title>agzes/404</title>
        <script>
            (function () {
                var path = window.location.pathname;
                var lower = path.toLowerCase();
                if (
                    lower === "/ahk-for-rpm" ||
                    lower.indexOf("/ahk-for-rpm/") === 0
                ) {
                    window.location.replace(
                        "https://github.com/Agzes/AHK-FOR-RPM",
                    );
                    return;
                }
                var map = {
                    "/afr": "/AFR",
                    "/fluautoclicker": "/FluAutoClicker",
                };
                for (var prefix in map) {
                    if (lower === prefix || lower.indexOf(prefix + "/") === 0) {
                        var target = map[prefix] + path.slice(prefix.length);
                        if (
                            window.location.hostname === "agzes.github.io" &&
                            target === path
                        ) {
                            return;
                        }
                        window.location.replace(
                            "https://agzes.github.io" +
                                target +
                                window.location.search +
                                window.location.hash,
                        );
                        return;
                    }
                }
            })();
        </script>
